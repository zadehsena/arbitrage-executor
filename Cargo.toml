[package]
name = "arbitrage-executor"
version = "0.1.0"
edition = "2024"
description = "Dry-run-first cross-venue arbitrage execution engine"
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
dotenvy = "0.15"
ed25519-dalek = { version = "2.1", features = ["pem", "pkcs8"] }
rand = "0.8"
rsa = { version = "0.9", features = ["pem", "sha2"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.15"
